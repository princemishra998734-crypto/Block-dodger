<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Dodger</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #09001f, #180044, #001d3d);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
}

.game-wrapper {
    text-align: center;
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
    color: #00ffff;
    text-shadow: 0 0 15px #00ffff;
}

.info {
    display: flex;
    justify-content: space-between;
    width: 400px;
    max-width: 95vw;
    margin: auto;
    margin-bottom: 10px;
    font-size: 20px;
    font-weight: bold;
}

#game {
    width: 400px;
    height: 600px;
    max-width: 95vw;
    max-height: 75vh;
    background: #050510;
    border: 3px solid #00ffff;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    box-shadow:
        0 0 20px #00ffff,
        inset 0 0 30px rgba(0,255,255,0.15);
}

.player {
    width: 55px;
    height: 25px;
    background: linear-gradient(90deg, #00ffff, #0088ff);
    border-radius: 7px;
    position: absolute;
    bottom: 20px;
    left: 172px;
    box-shadow: 0 0 15px #00ffff;
}

.block {
    width: 45px;
    height: 45px;
    position: absolute;
    top: -50px;
    background: linear-gradient(135deg, #ff1744, #ff6d00);
    border-radius: 8px;
    box-shadow: 0 0 15px #ff1744;
}

button {
    margin-top: 15px;
    padding: 12px 30px;
    border: none;
    border-radius: 25px;
    background: #00ffff;
    color: #001018;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px #00ffff;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
    background: white;
}

#gameOver {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
}

#gameOver h2 {
    font-size: 45px;
    color: #ff1744;
    text-shadow: 0 0 15px red;
    margin-bottom: 10px;
}

#gameOver p {
    font-size: 20px;
}

.instructions {
    margin-top: 12px;
    color: #aaa;
    font-size: 14px;
}

/* Mobile Controls */
.controls {
    display: none;
    justify-content: center;
    gap: 30px;
    margin-top: 15px;
}

.control-btn {
    width: 70px;
    height: 50px;
    margin: 0;
    padding: 0;
    font-size: 25px;
}

@media (max-width: 600px) {
    h1 {
        font-size: 32px;
    }

    #game {
        height: 65vh;
    }

    .controls {
        display: flex;
    }

    .instructions {
        display: none;
    }
}
</style>
</head>

<body>

<div class="game-wrapper">

    <h1>🚀 BLOCK DODGER</h1>

    <div class="info">
        <span>Score: <span id="score">0</span></span>
        <span>Best: <span id="highScore">0</span></span>
    </div>

    <div id="game">

        <div class="player" id="player"></div>

        <div id="gameOver">
            <h2>GAME OVER!</h2>
            <p>Your Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">🔄 PLAY AGAIN</button>
        </div>

    </div>

    <div class="controls">
        <button class="control-btn" id="leftBtn">⬅️</button>
        <button class="control-btn" id="rightBtn">➡️</button>
    </div>

    <button onclick="restartGame()">START / RESTART</button>

    <div class="instructions">
        ⬅️ ➡️ Use Arrow Keys to move &nbsp; | &nbsp; Dodge the blocks!
    </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const highScoreText = document.getElementById("highScore");
const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let playerX = 172;
let score = 0;
let highScore = localStorage.getItem("blockDodgerHighScore") || 0;

let gameRunning = false;
let blocks = [];

let speed = 3;
let spawnTime = 900;
let lastSpawn = 0;
let animationId;

highScoreText.textContent = highScore;


// =========================
// PLAYER MOVEMENT
// =========================

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft") {
        moveLeft();
    }

    if (e.key === "ArrowRight") {
        moveRight();
    }

});

function moveLeft() {

    if (!gameRunning) return;

    playerX -= 30;

    if (playerX < 0) {
        playerX = 0;
    }

    player.style.left = playerX + "px";
}

function moveRight() {

    if (!gameRunning) return;

    playerX += 30;

    const maxX = game.clientWidth - player.offsetWidth;

    if (playerX > maxX) {
        playerX = maxX;
    }

    player.style.left = playerX + "px";
}


// =========================
// MOBILE BUTTONS
// =========================

document.getElementById("leftBtn").addEventListener(
    "touchstart",
    function(e) {
        e.preventDefault();
        moveLeft();
    }
);

document.getElementById("rightBtn").addEventListener(
    "touchstart",
    function(e) {
        e.preventDefault();
        moveRight();
    }
);


// =========================
// CREATE BLOCK
// =========================

function createBlock() {

    const block = document.createElement("div");

    block.classList.add("block");

    const maxX = game.clientWidth - 45;

    const randomX = Math.floor(Math.random() * maxX);

    block.style.left = randomX + "px";

    block.style.top = "-50px";

    game.appendChild(block);

    blocks.push({
        element: block,
        x: randomX,
        y: -50
    });
}


// =========================
// COLLISION DETECTION
// =========================

function checkCollision(block) {

    const playerRect = player.getBoundingClientRect();
    const blockRect = block.element.getBoundingClientRect();

    return !(
        playerRect.right < blockRect.left ||
        playerRect.left > blockRect.right ||
        playerRect.bottom < blockRect.top ||
        playerRect.top > blockRect.bottom
    );
}


// =========================
// GAME LOOP
// =========================

function gameLoop(timestamp) {

    if (!gameRunning) return;

    // Create blocks
    if (timestamp - lastSpawn > spawnTime) {

        createBlock();

        lastSpawn = timestamp;

        // Increase difficulty
        if (spawnTime > 350) {
            spawnTime -= 10;
        }

        if (speed < 9) {
            speed += 0.03;
        }
    }


    // Move blocks
    for (let i = blocks.length - 1; i >= 0; i--) {

        const block = blocks[i];

        block.y += speed;

        block.element.style.top = block.y + "px";


        // Collision
        if (checkCollision(block)) {

            endGame();
            return;
        }


        // Block passed player
        if (block.y > game.clientHeight) {

            block.element.remove();

            blocks.splice(i, 1);

            score++;

            scoreText.textContent = score;
        }
    }

    animationId = requestAnimationFrame(gameLoop);
}


// =========================
// START GAME
// =========================

function startGame() {

    gameRunning = true;

    score = 0;
    speed = 3;
    spawnTime = 900;
    lastSpawn = 0;

    scoreText.textContent = "0";

    gameOverScreen.style.display = "none";

    playerX = (game.clientWidth - player.offsetWidth) / 2;

    player.style.left = playerX + "px";

    // Remove old blocks
    blocks.forEach(block => {
        block.element.remove();
    });

    blocks = [];

    cancelAnimationFrame(animationId);

    animationId = requestAnimationFrame(gameLoop);
}


// =========================
// GAME OVER
// =========================

function endGame() {

    gameRunning = false;

    cancelAnimationFrame(animationId);

    finalScore.textContent = score;

    gameOverScreen.style.display = "flex";


    // High Score
    if (score > highScore) {

        highScore = score;

        localStorage.setItem(
            "blockDodgerHighScore",
            highScore
        );

        highScoreText.textContent = highScore;
    }
}


// =========================
// RESTART
// =========================

function restartGame() {

    startGame();
}


// Start automatically
startGame();

</script>

</body>
</html>
